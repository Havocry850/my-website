<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - CareerBuddy</title>
  <style>
    body {
      background: linear-gradient(rgba(144, 238, 144, 0.9), rgba(144, 238, 144, 0.9)), url('https://images.unsplash.com/photo-1557682250-33bd709cbe85') no-repeat center center/cover;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: rgba(0, 100, 0, 0.6);
      padding: 30px;
      border-radius: 10px;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      width: 300px;
      text-align: center;
    }

    .login-box img {
      width: 80px;
      margin-bottom: 10px;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #004d00;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-box a {
      display: block;
      margin-top: 15px;
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="https://cdn.shortpixel.ai/client/q_lossless,ret_img,w_2735/https://www.bitext.com/wp-content/uploads/2019/01/bot-automation-234tdgf.png" alt="CareerBuddy Logo" />
    <h2>Sign In</h2>
    <form action="careerbuddy_home.html" method="GET">
      <input type="text" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <a href="signup.html">Don't have an account? Sign Up</a>
  </div>
</body>
</html>
