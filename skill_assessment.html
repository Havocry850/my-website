<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Assessment - CareerBuddy</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(144, 238, 144, 0.8), rgba(144, 238, 144, 0.8)), url('https://images.unsplash.com/photo-1551434678-e076c223a692') no-repeat center center/cover;
      min-height: 100vh;
      color: #003300;
    }

    .navbar {
      background: rgba(0, 50, 0, 0.6);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 8px 15px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .navbar a:hover {
      background: rgba(255,255,255,0.5);
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .question {
      margin-bottom: 25px;
    }

    .question p {
      font-weight: bold;
    }

    .question label {
      display: block;
      margin: 5px 0;
      cursor: pointer;
    }

    button {
      background: #006600;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      display: block;
      margin: 20px auto;
      transition: background 0.3s;
    }

    button:hover {
      background: #004d00;
    }

    .result {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>CareerBuddy</h1>
    <a href="careerbuddy_home.html">Back to Dashboard</a>
  </div>

  <div class="container">
    <h2>Skill Assessment</h2>
    <form id="quizForm">
      <div class="question">
        <p>1. Which language is most commonly used for web development?</p>
        <label><input type="radio" name="q1" value="correct" /> HTML</label>
        <label><input type="radio" name="q1" value="wrong" /> Python</label>
        <label><input type="radio" name="q1" value="wrong" /> Java</label>
      </div>

      <div class="question">
        <p>2. What is the capital of the Philippines?</p>
        <label><input type="radio" name="q2" value="wrong" /> Cebu</label>
        <label><input type="radio" name="q2" value="correct" /> Manila</label>
        <label><input type="radio" name="q2" value="wrong" /> Davao</label>
      </div>

      <div class="question">
        <p>3. Which one is a soft skill?</p>
        <label><input type="radio" name="q3" value="correct" /> Communication</label>
        <label><input type="radio" name="q3" value="wrong" /> JavaScript</label>
        <label><input type="radio" name="q3" value="wrong" /> Excel</label>
      </div>

      <button type="button" onclick="submitQuiz()">Submit</button>
    </form>

    <div class="result" id="resultBox"></div>
  </div>

  <script>
    function submitQuiz() {
      let score = 0;
      const totalQuestions = 3;

      const answers = document.querySelectorAll('input[type="radio"]:checked');
      answers.forEach(answer => {
        if (answer.value === "correct") score++;
      });

      const resultBox = document.getElementById("resultBox");
      resultBox.textContent = `You got ${score} out of ${totalQuestions} correct!`;
    }
  </script>
</body>
</html>
