<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CareerBuddy - Dashboard</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(rgba(144, 238, 144, 0.7), rgba(144, 238, 144, 0.7)), url('https://images.unsplash.com/photo-1522199710521-72d69614c702') no-repeat center center/cover;
      overflow: hidden;
    }

    .navbar {
      background: rgba(0, 50, 0, 0.5);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      margin: 0;
      font-size: 2rem;
      color: #004d00;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-buttons a {
      text-decoration: none;
      color: white;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .nav-buttons a:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .content {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
    }

    .content h2 {
      font-size: 2.5rem;
      color: #003300;
      text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.3);
    }

    .content p {
      font-size: 1.2rem;
      color: white;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
    }

    .selection-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      justify-items: center;
      margin: 40px auto;
      max-width: 600px;
    }

    .selection-container a {
      text-decoration: none;
      color: white;
      font-size: 1.2rem;
      padding: 20px 30px;
      border-radius: 10px;
      background: rgba(0, 100, 0, 0.6);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
